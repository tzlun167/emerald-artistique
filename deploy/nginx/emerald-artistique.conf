# emerald-artistique.com — nginx 站台設定
#
# ⚠️ 使用方式：這份設定是「待套用」的範本，不是自動生效的檔案。
#    部署前請先備份現有設定，再與現況合併（不要直接整檔覆蓋）。
#
# 產生日期：2026-11-10
# 對應問題：檢查報告-2026-11-10.md 的 P0-2（.htaccess 無效且外洩）、P0-3（SPA 深連結 404）、
#           P1-1（孤兒 asset）、P2-2（缺 robots/sitemap/favicon）、P2-3（缺快取標頭）

server {
    listen 80;
    listen [::]:80;
    server_name emerald-artistique.com www.emerald-artistique.com;

    # ── 如有 HTTPS，請改由 443 server 區塊服務並在此 301 導向 ──
    # return 301 https://emerald-artistique.com$request_uri;

    root /var/www/emerald-artistique;
    index index.html;

    charset utf-8;

    # ── 修 P0-2：封鎖 dotfile（原本 /.htaccess 可被公開下載）──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── 修 P0-2：封鎖部署文件與原始設定，避免外洩 ──
    location ~ ^/(doc|deploy)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── API：PHP-FPM ──
    # 依實際 PHP 版本調整（此機為 Ubuntu，PHP 8.1 → php8.1-fpm）
    location ~ ^/api/.+\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_read_timeout 30s;
    }

    # ── 修 P0-3：SPA fallback（原本 /contact /about /shop /products 皆 404）──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 修 P2-2：站點基本檔案 ──
    location = /robots.txt  { access_log off; log_not_found off; }
    location = /favicon.ico { access_log off; log_not_found off; expires 30d; }
    location = /sitemap.xml { access_log off; log_not_found off; }

    # ── 修 P2-3：資產快取標頭（原本完全沒有 Cache-Control / Expires）──
    # 檔名含 content hash，可長期快取
    location ~* ^/assets/.*\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 6M;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── HTML 不快取，確保改版立即生效 ──
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── gzip（原本 .htaccess 的 mod_deflate 在 nginx 無效）──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── 安全標頭 ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
